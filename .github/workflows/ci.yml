name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            experimental: false
          - os: ubuntu-latest
            node: 24
            experimental: false
          - os: windows-latest
            node: 22
            experimental: false
          - os: windows-latest
            node: 24
            experimental: false
          - os: macos-latest
            node: 24
            experimental: false
          - os: ubuntu-latest
            node: current
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete project check
        run: npm run check

  release-readiness:
    name: Package and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Enforce coverage floor
        run: npm run test:coverage

      - name: Verify installable package
        id: package
        env:
          CIRCUITARIUM_KEEP_PACKAGE: "1"
        run: npm run package:check

      - name: Verify one-click MCPB bundle
        env:
          CIRCUITARIUM_PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm run mcpb:check

  logisim-e2e:
    name: Official Logisim-evolution 4.1.0 JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Download and verify official Logisim-evolution JAR
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/logisim-evolution-4.1.0-all.jar" \
            "https://github.com/logisim-evolution/logisim-evolution/releases/download/v4.1.0/logisim-evolution-4.1.0-all.jar"
          echo "fe6386a3217a591bcc311a4eda49e1f43a389b499dd3d0f6f40f344fc85f2577  $RUNNER_TEMP/logisim-evolution-4.1.0-all.jar" \
            | sha256sum --check

      - name: Run version-pinned JAR and MCP end-to-end checks
        env:
          CIRCUITARIUM_LOGISIM_JAR: ${{ runner.temp }}/logisim-evolution-4.1.0-all.jar
        run: npm run logisim:e2e

      - name: Verify installable package with the official JAR
        id: package
        env:
          CIRCUITARIUM_KEEP_PACKAGE: "1"
          CIRCUITARIUM_LOGISIM_JAR: ${{ runner.temp }}/logisim-evolution-4.1.0-all.jar
        run: npm run package:check

      - name: Verify MCPB bundle with the official JAR
        env:
          CIRCUITARIUM_LOGISIM_JAR: ${{ runner.temp }}/logisim-evolution-4.1.0-all.jar
          CIRCUITARIUM_PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm run mcpb:check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
