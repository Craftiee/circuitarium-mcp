name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: npm
      url: https://www.npmjs.com/package/circuitarium-mcp

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify tag belongs to main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main

      - name: Install dependencies
        run: npm ci

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check

      - name: Run release checks
        run: |
          npm run lint
          npm run check

      - name: Build and smoke-test package
        id: package
        env:
          CIRCUITARIUM_KEEP_PACKAGE: "1"
        run: npm run package:check

      - name: Retain verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circuitarium-mcp-${{ github.ref_name }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish the verified package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          npm publish "${{ steps.package.outputs.tarball }}"
          --access public
          --provenance
          --tag "${{ contains(github.ref_name, '-') && 'next' || 'latest' }}"
