name: Publish release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish npm
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      npm_tag: ${{ steps.release_identity.outputs.npm_tag }}
      prerelease: ${{ steps.release_identity.outputs.prerelease }}
    environment:
      name: npm
      url: https://www.npmjs.com/package/circuitarium-mcp
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Pin npm CLI for trusted publishing
        run: |
          npm install --global npm@11.16.0
          node --version
          npm --version

      - name: Verify tag belongs to main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main

      - name: Install dependencies
        run: npm ci

      - name: Verify release identity
        id: release_identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check

      - name: Run release checks
        run: |
          npm run lint
          npm run check
          npm run test:coverage

      - name: Download and verify official Logisim-evolution JAR
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --silent \
            --show-error \
            --tlsv1.2 \
            --output "$RUNNER_TEMP/logisim-evolution-4.1.0-all.jar" \
            "https://github.com/logisim-evolution/logisim-evolution/releases/download/v4.1.0/logisim-evolution-4.1.0-all.jar"
          echo "fe6386a3217a591bcc311a4eda49e1f43a389b499dd3d0f6f40f344fc85f2577  $RUNNER_TEMP/logisim-evolution-4.1.0-all.jar" \
            | sha256sum --check --strict

      - name: Run official Logisim-evolution JAR end-to-end checks
        env:
          CIRCUITARIUM_LOGISIM_JAR: ${{ runner.temp }}/logisim-evolution-4.1.0-all.jar
        run: npm run logisim:e2e

      - name: Build and smoke-test package
        id: package
        env:
          CIRCUITARIUM_KEEP_PACKAGE: "1"
          CIRCUITARIUM_LOGISIM_JAR: ${{ runner.temp }}/logisim-evolution-4.1.0-all.jar
        run: npm run package:check

      - name: Build and verify MCPB bundle
        id: mcpb
        env:
          CIRCUITARIUM_PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          CIRCUITARIUM_KEEP_MCPB: "1"
          CIRCUITARIUM_LOGISIM_JAR: ${{ runner.temp }}/logisim-evolution-4.1.0-all.jar
        run: npm run mcpb:check

      - name: Retain verified npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.ref_name }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

      - name: Retain verified MCPB bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-bundle-${{ github.ref_name }}
          path: ${{ steps.mcpb.outputs.bundle }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish the exact verified package
        env:
          NPM_DIST_TAG: ${{ steps.release_identity.outputs.npm_tag }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          expected_integrity="$(
            node --input-type=commonjs \
              -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);' \
              "$PACKAGE_TARBALL"
          )"

          if published_json="$(npm view "$package_spec" dist.integrity --json 2>/dev/null)"; then
            published_integrity="$(
              node --input-type=commonjs \
                -e 'const { readFileSync } = require("node:fs"); const value = JSON.parse(readFileSync(0, "utf8")); if (typeof value !== "string") process.exit(2); process.stdout.write(value);' \
                <<<"$published_json"
            )"
            test "$published_integrity" = "$expected_integrity"
            echo "$package_spec already exists with the verified tarball integrity."
          else
            npm publish "$PACKAGE_TARBALL" \
              --access public \
              --provenance \
              --tag "$NPM_DIST_TAG"
          fi

      - name: Verify npm publication and provenance
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          expected_integrity="$(
            node --input-type=commonjs \
              -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);' \
              "$PACKAGE_TARBALL"
          )"
          published_integrity=""

          for attempt in {1..18}; do
            if published_json="$(npm view "$package_spec" dist.integrity --json 2>/dev/null)"; then
              published_integrity="$(
                node --input-type=commonjs \
                  -e 'const { readFileSync } = require("node:fs"); const value = JSON.parse(readFileSync(0, "utf8")); if (typeof value !== "string") process.exit(2); process.stdout.write(value);' \
                  <<<"$published_json"
              )"
              if [[ "$published_integrity" = "$expected_integrity" ]]; then
                echo "Verified $package_spec at the public npm registry."
                break
              fi
              echo "::error::$package_spec exists with unexpected tarball integrity."
              exit 1
            fi
            echo "Waiting for npm visibility (attempt $attempt/18)..."
            sleep 10
          done

          test "$published_integrity" = "$expected_integrity"

          attestation_verified=""
          for attempt in {1..18}; do
            if attestations_json="$(
              npm view "$package_spec" dist.attestations --json 2>/dev/null
            )" &&
              node --input-type=commonjs \
                -e 'const { readFileSync } = require("node:fs"); const value = JSON.parse(readFileSync(0, "utf8")); if (typeof value?.url !== "string" || !value.url.startsWith("https://registry.npmjs.org/-/npm/v1/attestations/") || value?.provenance?.predicateType !== "https://slsa.dev/provenance/v1") process.exit(2);' \
                <<<"$attestations_json"
            then
              attestation_verified="1"
              echo "Verified SLSA v1 provenance for $package_spec."
              break
            fi
            echo "Waiting for npm provenance (attempt $attempt/18)..."
            sleep 10
          done

          test "$attestation_verified" = "1"

  registry:
    name: Publish MCP Registry metadata
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --silent \
            --show-error \
            --tlsv1.2 \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/$archive"
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  $archive" |
            sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Validate Registry metadata
        run: ./mcp-publisher validate server.json

      - name: Publish and verify Registry version
        shell: bash
        run: |
          set -euo pipefail
          server_name="$(jq -r '.name' server.json)"
          server_version="$(jq -r '.version' server.json)"
          encoded_name="$(jq -nr --arg value "$server_name" '$value|@uri')"
          registry_url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/${server_version}"
          registry_response=""

          registry_matches() {
            jq -e \
              --arg name "$server_name" \
              --arg version "$server_version" \
              '.server.name == $name and
               .server.version == $version and
               (.server.packages | length) == 1 and
               .server.packages[0].registryType == "npm" and
               .server.packages[0].identifier == "circuitarium-mcp" and
               .server.packages[0].version == $version and
               .server.packages[0].transport.type == "stdio"' \
              <<<"$1" >/dev/null
          }

          if registry_response="$(curl --fail --silent --show-error "$registry_url" 2>/dev/null)"; then
            if ! registry_matches "$registry_response"; then
              echo "::error::The existing Registry version does not match server.json."
              exit 1
            fi
            echo "$server_name@$server_version is already present in the MCP Registry."
          else
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish server.json
          fi

          for attempt in {1..18}; do
            if registry_response="$(curl --fail --silent --show-error "$registry_url" 2>/dev/null)"; then
              if registry_matches "$registry_response"; then
                echo "Verified $server_name@$server_version in the official MCP Registry."
                break
              fi
              echo "::error::The Registry version does not match server.json."
              exit 1
            fi
            echo "Waiting for MCP Registry visibility (attempt $attempt/18)..."
            sleep 10
          done

          registry_matches "$registry_response"

  github-release:
    name: Create GitHub Release
    needs:
      - publish
      - registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package-${{ github.ref_name }}
          path: release-artifacts/npm

      - name: Download verified MCPB bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcpb-bundle-${{ github.ref_name }}
          path: release-artifacts/mcpb

      - name: Create release from verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IS_PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find release-artifacts/npm -maxdepth 1 -type f -name '*.tgz')
          mapfile -t bundles < <(find release-artifacts/mcpb -maxdepth 1 -type f -name '*.mcpb')
          test "${#tarballs[@]}" -eq 1
          test "${#bundles[@]}" -eq 1

          release_version="${GITHUB_REF_NAME#v}"
          release_heading="## [${release_version}]"
          awk -v heading="$release_heading" '
            index($0, heading) == 1 {
              capture = 1
            }
            capture && /^## \[/ && index($0, heading) != 1 {
              exit
            }
            capture {
              print
            }
          ' CHANGELOG.md > release-notes.md
          [[ "$(head -n 1 release-notes.md)" == "$release_heading"* ]]
          grep -Eq '[^[:space:]]' release-notes.md

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit \
              "$GITHUB_REF_NAME" \
              --title "Circuitarium MCP $GITHUB_REF_NAME" \
              --notes-file release-notes.md
            gh release upload \
              "$GITHUB_REF_NAME" \
              "${tarballs[0]}" \
              "${bundles[0]}" \
              --clobber
          else
            release_flags=(
              --verify-tag
              --notes-file release-notes.md
              --title "Circuitarium MCP $GITHUB_REF_NAME"
            )
            if [[ "$RELEASE_IS_PRERELEASE" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create \
              "$GITHUB_REF_NAME" \
              "${tarballs[0]}" \
              "${bundles[0]}" \
              "${release_flags[@]}"
          fi
